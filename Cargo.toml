# [Phase 0] Workspace scaffold. Later phases add members and dependencies.
[workspace]
resolver = "2"
members = [
    "crates/durable-core",
    "crates/durable-llm",
    "crates/durable-metrics",
    "apps/demo-agent",
    "apps/bench",
]
# bindings/ts joins the workspace in Phase 8 (napi-rs).

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }

# Internal crates
durable-core = { path = "crates/durable-core" }
durable-llm = { path = "crates/durable-llm" }
durable-metrics = { path = "crates/durable-metrics" }
